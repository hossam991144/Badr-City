<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>New Badr City</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,sans-serif;
}

body{
    min-height:100vh;
    background:#050816;
    color:#fff;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    overflow-x:hidden;
    position:relative;
}

/* الخلفية */

body::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    background:#2563eb;
    filter:blur(160px);
    top:-180px;
    right:-180px;
    z-index:-1;
}

body::after{
    content:"";
    position:absolute;
    width:450px;
    height:450px;
    background:#06b6d4;
    filter:blur(160px);
    bottom:-180px;
    left:-180px;
    z-index:-1;
}

/* الكارت */

.container{
    width:100%;
    max-width:850px;

    text-align:center;

    padding:70px 50px;

    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);

    backdrop-filter:blur(20px);

    border-radius:35px;

    animation:show 1s ease;
}

/* العنوان */

h1{
    font-size:58px;
    line-height:1.1;
    margin-bottom:20px;
}

h1 span{
    color:#38bdf8;
}

/* الوصف */

p{
    font-size:18px;
    color:#c8d3e4;
    line-height:1.8;
    margin-top:10px;
}

/* الرابط */

a{
    text-decoration:none;
}

/* الزر */

button{
    margin-top:35px;

    padding:15px 45px;

    border:none;

    border-radius:50px;

    background:#2563eb;

    color:white;

    font-size:18px;

    cursor:pointer;

    transition:.3s;
}

button:hover{
    transform:translateY(-5px);

    box-shadow:0 0 30px #2563eb;
}

/* ظهور الصفحة */

@keyframes show{

    from{
        opacity:0;
        transform:translateY(40px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* الموبايل */

@media (max-width:800px){

.container{

    padding:50px 20px;

}

h1{

    font-size:38px;

}

p{

    font-size:16px;

}

button{

    width:100%;
    max-width:260px;

}

}

</style>

</head>

<body>

<div class="container">

    <h1>
        New <span>Badr City</span>
    </h1>

    <p>
        Displaying descriptive and spatial data for city infrastructure facilities.
    </p>

    <a href="https://www.arcgis.com/apps/instant/basic/index.html?appid=0b05465b2a25402e8a93757013b9f9ce" target="_blank">

        <button>
            View Project
        </button>

    </a>

</div>

</body>

</html>
